<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Vinyl grooved specular sheen gradient -->
    <radialGradient id="vinylGrooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="25%" stop-color="#141414" />
      <stop offset="35%" stop-color="#222222" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="65%" stop-color="#1f1f1f" />
      <stop offset="80%" stop-color="#0f0f0f" />
      <stop offset="95%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>

    <!-- Conical-like lighting sheen across grooves -->
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2442C" />
      <stop offset="100%" stop-color="#BF2814" />
    </linearGradient>

    <filter id="vinylShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#vinylShadow)">
    <!-- Main LP Body -->
    <circle cx="160" cy="160" r="148" fill="url(#vinylGrooves)" />

    <!-- Specular highlight sheen overlay -->
    <circle cx="160" cy="160" r="148" fill="url(#sheen1)" mix-blend-mode="screen" />

    <!-- Concentric fine sound grooves -->
    <circle cx="160" cy="160" r="142" fill="none" stroke="#333333" stroke-width="0.8" opacity="0.6" />
    <circle cx="160" cy="160" r="136" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.8" />
    <circle cx="160" cy="160" r="128" fill="none" stroke="#383838" stroke-width="0.75" opacity="0.5" />
    <circle cx="160" cy="160" r="120" fill="none" stroke="#1f1f1f" stroke-width="0.6" opacity="0.7" />
    <circle cx="160" cy="160" r="112" fill="none" stroke="#353535" stroke-width="0.8" opacity="0.5" />
    <circle cx="160" cy="160" r="104" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.8" />
    <circle cx="160" cy="160" r="96" fill="none" stroke="#303030" stroke-width="0.7" opacity="0.6" />
    <circle cx="160" cy="160" r="88" fill="none" stroke="#252525" stroke-width="0.5" opacity="0.7" />
    <circle cx="160" cy="160" r="80" fill="none" stroke="#333333" stroke-width="0.75" opacity="0.5" />
    <circle cx="160" cy="160" r="72" fill="none" stroke="#202020" stroke-width="0.5" opacity="0.8" />
    <circle cx="160" cy="160" r="64" fill="none" stroke="#2b2b2b" stroke-width="0.6" opacity="0.6" />

    <!-- Run-out Groove / Dead Wax -->
    <circle cx="160" cy="160" r="56" fill="none" stroke="#181818" stroke-width="1.2" opacity="0.9" />

    <!-- Red Center Label (33 1/3 RPM) -->
    <circle cx="160" cy="160" r="50" fill="url(#labelGrad)" stroke="#A01D0C" stroke-width="1" />
    <circle cx="160" cy="160" r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.75" />
    <circle cx="160" cy="160" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5" />

    <!-- Spindle Hole Center -->
    <circle cx="160" cy="160" r="9" fill="#0E0E0E" stroke="#E2442C" stroke-width="1.5" />
  </g>
</svg>

