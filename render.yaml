services:
  # Web service with persistent disk
  - type: web
    name: rapira
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENT_STORAGE_PATH
        value: /opt/render/project/src/persistent-storage
      - key: PORT
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    disk:
      name: persistent-storage
      mountPath: /opt/render/project/src/persistent-storage
      sizeGB: 1
