<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="vinylShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d1d16" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#vinylShadow)">
    <!-- Vinyl Sleeve / Jacket (Offset) -->
    <rect x="60" y="80" width="220" height="220" rx="10" fill="#FCF0E4" stroke="#EAC8B7" stroke-width="2"/>
    <rect x="75" y="95" width="190" height="190" rx="6" fill="#9F190E"/>
    <text x="170" y="180" font-family="'Titan One', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">RAPIRA</text>
    <text x="170" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#EAC8B7" text-anchor="middle" letter-spacing="3">DEBUT LP • VOL. 1</text>

    <!-- Vinyl Disc (Peeking out to the right) -->
    <circle cx="270" cy="190" r="105" fill="#181514" stroke="#2D2928" stroke-width="2"/>
    <!-- Grooves -->
    <circle cx="270" cy="190" r="92" stroke="#252120" stroke-width="1.5" fill="none"/>
    <circle cx="270" cy="190" r="80" stroke="#252120" stroke-width="1.5" fill="none"/>
    <circle cx="270" cy="190" r="68" stroke="#252120" stroke-width="1.5" fill="none"/>
    <circle cx="270" cy="190" r="56" stroke="#252120" stroke-width="1.5" fill="none"/>
    
    <!-- Center Label -->
    <circle cx="270" cy="190" r="38" fill="#9F190E" stroke="#FCF0E4" stroke-width="2"/>
    <circle cx="270" cy="190" r="7" fill="#FCF0E4"/>
    <text x="270" y="186" font-family="'Titan One', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">RAPIRA</text>
  </g>
</svg>
