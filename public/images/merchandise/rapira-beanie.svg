<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="beanieShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d1d16" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="beanieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2928"/>
      <stop offset="50%" stop-color="#1B1716"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>
  </defs>

  <g filter="url(#beanieShadow)">
    <!-- Crown Dome -->
    <path d="M120 250 C110 140 160 90 200 90 C240 90 290 140 280 250 Z" fill="url(#beanieGrad)"/>
    
    <!-- Ribbed Texture Lines -->
    <path d="M140 250 C135 170 165 110 200 100" stroke="#383331" stroke-width="2"/>
    <path d="M170 250 C165 170 185 105 200 95" stroke="#383331" stroke-width="2"/>
    <path d="M230 250 C235 170 215 105 200 95" stroke="#383331" stroke-width="2"/>
    <path d="M260 250 C265 170 235 110 200 100" stroke="#383331" stroke-width="2"/>

    <!-- Folded Cuff -->
    <rect x="105" y="240" width="190" height="65" rx="14" fill="#24201F" stroke="#12100F" stroke-width="2"/>
    
    <!-- Cuff Ribbing -->
    <line x1="125" y1="240" x2="125" y2="305" stroke="#383331" stroke-width="1.5"/>
    <line x1="145" y1="240" x2="145" y2="305" stroke="#383331" stroke-width="1.5"/>
    <line x1="255" y1="240" x2="255" y2="305" stroke="#383331" stroke-width="1.5"/>
    <line x1="275" y1="240" x2="275" y2="305" stroke="#383331" stroke-width="1.5"/>

    <!-- Center Woven Patch -->
    <rect x="165" y="252" width="70" height="40" rx="6" fill="#9F190E" stroke="#FCF0E4" stroke-width="1.5"/>
    <text x="200" y="277" font-family="'Titan One', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RAPIRA</text>
  </g>
</svg>
