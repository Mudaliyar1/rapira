<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="toteShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d1d16" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="toteBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3E8"/>
      <stop offset="50%" stop-color="#F3E5D4"/>
      <stop offset="100%" stop-color="#E2D0BE"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAD7C3"/>
      <stop offset="100%" stop-color="#D0BC9F"/>
    </linearGradient>
  </defs>

  <g filter="url(#toteShadow)">
    <!-- Straps -->
    <path d="M160 135 C160 40 240 40 240 135" stroke="url(#strapGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M145 135 C145 50 225 50 225 135" stroke="#C4B097" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.65"/>
    
    <!-- Bag Body -->
    <path d="M110 135 L290 135 Q305 135 308 150 L320 345 Q322 360 305 360 L95 360 Q78 360 80 345 L92 150 Q95 135 110 135 Z" fill="url(#toteBodyGrad)" stroke="#DEC9B7" stroke-width="2"/>
    
    <!-- Stitched Seams on Straps -->
    <line x1="152" y1="135" x2="148" y2="185" stroke="#BFAB97" stroke-width="3" stroke-dasharray="2 3"/>
    <line x1="232" y1="135" x2="236" y2="185" stroke="#BFAB97" stroke-width="3" stroke-dasharray="2 3"/>

    <!-- Center Brand Typography -->
    <text x="200" y="240" font-family="'Titan One', 'Montserrat', Arial Black, sans-serif" font-weight="900" font-size="28" fill="#9F190E" text-anchor="middle" letter-spacing="3">RAPIRA</text>
    
    <rect x="160" y="255" width="80" height="3" rx="1.5" fill="#9F190E" opacity="0.35"/>
  </g>
</svg>

