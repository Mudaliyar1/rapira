<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="capShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d1d16" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="capBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B82216"/>
      <stop offset="45%" stop-color="#9F190E"/>
      <stop offset="100%" stop-color="#6F0C05"/>
    </linearGradient>
    <linearGradient id="capBrimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9F190E"/>
      <stop offset="100%" stop-color="#550A04"/>
    </linearGradient>
  </defs>

  <g filter="url(#capShadow)">
    <!-- Crown Dome -->
    <path d="M100 245 C95 145 150 110 230 115 C285 120 315 165 320 245 Z" fill="url(#capBodyGrad)"/>
    
    <!-- Top button -->
    <ellipse cx="215" cy="118" rx="8" ry="5" fill="#600B04"/>
    
    <!-- Panel Seam lines -->
    <path d="M210 118 Q195 180 185 245" stroke="#7A0F07" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M165 125 Q140 180 125 245" stroke="#7A0F07" stroke-width="2" stroke-dasharray="3 2"/>
    
    <!-- Curved Visor / Brim -->
    <path d="M80 250 C70 270 110 300 170 312 C240 324 315 310 335 272 C320 252 265 240 185 242 C120 244 85 245 80 250 Z" fill="url(#capBrimGrad)"/>
    <path d="M90 265 C125 292 205 310 285 290" stroke="#480702" stroke-width="2.5" fill="none"/>

    <!-- Embroidered RAPIRA Text -->
    <g transform="rotate(-5 200 185)">
      <text x="200" y="195" font-family="'Titan One', 'Montserrat', Arial Black, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">RAPIRA</text>
    </g>
  </g>
</svg>

