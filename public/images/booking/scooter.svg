<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="scooter-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#9F190E" flood-opacity="0.15" />
    </filter>
    <linearGradient id="scooter-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB432" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#DE8C12" />
    </linearGradient>
    <linearGradient id="scooter-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA2114" />
      <stop offset="100%" stop-color="#801209" />
    </linearGradient>
    <linearGradient id="scooter-seat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C" />
      <stop offset="100%" stop-color="#5A3326" />
    </linearGradient>
    <linearGradient id="headlight-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="160" cy="174" rx="112" ry="10" fill="#EAC8B7" opacity="0.65" />

  <g filter="url(#scooter-shadow)">
    <!-- Back Wheel -->
    <g transform="translate(85, 142)">
      <circle cx="0" cy="0" r="28" fill="#25211F" />
      <circle cx="0" cy="0" r="21" fill="#FCF0E4" stroke="#EAC8B7" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#BA2114" />
      <circle cx="0" cy="0" r="4" fill="#FCF0E4" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(235, 142)">
      <circle cx="0" cy="0" r="28" fill="#25211F" />
      <circle cx="0" cy="0" r="21" fill="#FCF0E4" stroke="#EAC8B7" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#BA2114" />
      <circle cx="0" cy="0" r="4" fill="#FCF0E4" />
    </g>

    <!-- Rear Cowl / Engine Cover (Left bulge) -->
    <path d="M 60 135 C 55 105, 80 88, 125 90 C 145 91, 155 102, 158 135 C 158 148, 115 152, 60 135 Z" fill="url(#scooter-body)" stroke="#DE8C12" stroke-width="1.5" />
    <!-- Rear decorative vents -->
    <line x1="72" y1="114" x2="100" y2="114" stroke="#801209" stroke-width="2.5" stroke-linecap="round" />
    <line x1="75" y1="122" x2="106" y2="122" stroke="#801209" stroke-width="2.5" stroke-linecap="round" />
    <line x1="78" y1="130" x2="108" y2="130" stroke="#801209" stroke-width="2.5" stroke-linecap="round" />

    <!-- Floorboard and Central Tunnel -->
    <path d="M 130 144 L 195 144 L 205 130 L 150 128 Z" fill="#4A4A4F" />
    <path d="M 132 142 L 193 142" stroke="#25211F" stroke-width="3" stroke-linecap="round" />
    <path d="M 134 138 L 190 138" stroke="#25211F" stroke-width="3" stroke-linecap="round" />

    <!-- Rear Tail Light -->
    <path d="M 54 116 Q 48 116 48 122 Q 48 128 56 128 Z" fill="#BA2114" stroke="#801209" stroke-width="1" />

    <!-- Front Leg Shield (Curved front fairing) -->
    <path d="M 190 144 L 205 125 C 215 110, 222 80, 224 58 C 224 55, 212 55, 206 70 C 198 90, 188 120, 182 144 Z" fill="url(#scooter-body)" />
    <!-- Chrome Trim along front edge of leg shield -->
    <path d="M 224 58 C 223 80, 215 110, 205 125 L 190 144" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Front Mudguard / Fender -->
    <path d="M 216 116 C 222 108, 248 108, 255 122 C 258 128, 258 138, 254 142 C 248 135, 235 126, 216 126 Z" fill="url(#scooter-body)" stroke="#DE8C12" stroke-width="1.5" />
    <!-- Fender crest (little chrome fin) -->
    <path d="M 242 110 Q 248 106 252 113" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Dual Leather Saddle (Two-seater for date / 2 people!) -->
    <path d="M 90 90 C 90 82, 105 76, 130 76 C 145 76, 160 82, 168 88 C 172 92, 168 96, 155 96 C 130 96, 100 96, 90 90 Z" fill="url(#scooter-seat)" stroke="#4A2315" stroke-width="1.5" />
    <!-- Seat stitching -->
    <path d="M 95 86 C 115 82, 140 82, 162 88" fill="none" stroke="#C49A82" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 130 76 L 130 96" stroke="#4A2315" stroke-width="1.5" opacity="0.6" />

    <!-- Chrome Rear Grab Rail / Luggage Rack -->
    <path d="M 70 94 L 62 82 L 86 82 L 92 90" fill="none" stroke="#68615D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Steering Column & Handlebars -->
    <line x1="223" y1="62" x2="225" y2="44" stroke="#888891" stroke-width="4.5" stroke-linecap="round" />

    <!-- Headlight Casing (Horizontal retro oval handlebar pod) -->
    <ellipse cx="225" cy="42" rx="14" ry="10" fill="url(#scooter-body)" stroke="#DE8C12" stroke-width="1.5" />
    <!-- Handlebar extensions and grips -->
    <path d="M 215 44 L 202 46" stroke="#888891" stroke-width="4" stroke-linecap="round" />
    <rect x="196" y="43" width="9" height="6" rx="2" fill="#5A3326" />
    <path d="M 235 44 L 244 46" stroke="#888891" stroke-width="4" stroke-linecap="round" />
    <rect x="241" y="43" width="9" height="6" rx="2" fill="#5A3326" />

    <!-- Chrome Mirror -->
    <path d="M 212 42 Q 206 32 208 26" fill="none" stroke="#888891" stroke-width="2" />
    <ellipse cx="208" cy="25" rx="5" ry="5" fill="#FCF0E4" stroke="#888891" stroke-width="1.5" />

    <!-- Round Headlamp Lens -->
    <ellipse cx="236" cy="42" rx="4" ry="7" fill="#FFFBEB" stroke="#888891" stroke-width="1.5" />

    <!-- Headlight Glow Rays (as seen in the reference!) -->
    <!-- Soft wide beam -->
    <polygon points="241,42 295,22 295,62" fill="url(#headlight-beam)" />
    <!-- 3 distinct warm rays -->
    <line x1="244" y1="36" x2="270" y2="28" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <line x1="246" y1="42" x2="276" y2="42" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <line x1="244" y1="48" x2="270" y2="56" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Couple / Duo Hearts / Music notes in air -->
  <g opacity="0.85">
    <path d="M 68 55 C 68 50, 75 48, 78 54 C 81 48, 88 50, 88 55 C 88 62, 78 68, 78 68 C 78 68, 68 62, 68 55 Z" fill="#9F190E" />
    <path d="M 120 40 Q 126 34 132 38" fill="none" stroke="#9F190E" stroke-width="2" stroke-linecap="round" />
    <circle cx="120" cy="40" r="2.5" fill="#9F190E" />
  </g>
</svg>
