<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="car-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#9F190E" flood-opacity="0.16" />
    </filter>
    <linearGradient id="car-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDB432" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#DE8C12" />
    </linearGradient>
    <linearGradient id="car-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA2114" />
      <stop offset="100%" stop-color="#801209" />
    </linearGradient>
    <linearGradient id="car-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BEE3F8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="car-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="160" cy="174" rx="122" ry="10" fill="#EAC8B7" opacity="0.65" />

  <g filter="url(#car-shadow)">
    <!-- Back Wheel -->
    <g transform="translate(88, 144)">
      <circle cx="0" cy="0" r="27" fill="#25211F" />
      <circle cx="0" cy="0" r="19" fill="#FCF0E4" stroke="#EAC8B7" stroke-width="2" />
      <circle cx="0" cy="0" r="9" fill="#BA2114" />
      <circle cx="0" cy="0" r="3.5" fill="#FCF0E4" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(232, 144)">
      <circle cx="0" cy="0" r="27" fill="#25211F" />
      <circle cx="0" cy="0" r="19" fill="#FCF0E4" stroke="#EAC8B7" stroke-width="2" />
      <circle cx="0" cy="0" r="9" fill="#BA2114" />
      <circle cx="0" cy="0" r="3.5" fill="#FCF0E4" />
    </g>

    <!-- Wheel arches / cutouts -->
    <!-- Car Lower Silhouette & Body -->
    <path d="M 42 136 C 42 126, 48 116, 62 114 L 92 110 L 132 72 C 142 62, 155 58, 175 58 L 210 58 C 224 58, 234 64, 240 76 L 254 105 L 274 108 C 284 110, 290 118, 288 128 L 284 140 C 282 144, 275 146, 268 146 L 260 146 C 258 130, 245 120, 232 120 C 219 120, 206 130, 204 146 L 116 146 C 114 130, 101 120, 88 120 C 75 120, 62 130, 60 146 L 46 146 C 42 146, 42 140, 42 136 Z" fill="url(#car-body)" stroke="#DE8C12" stroke-width="1.5" />

    <!-- Crimson Lower Rocker Stripe & Accents -->
    <path d="M 60 143 L 64 136 C 68 126, 78 123, 88 123 C 98 123, 108 126, 112 136 L 116 143 L 204 143 L 208 136 C 212 126, 222 123, 232 123 C 242 123, 252 126, 256 136 L 260 143 L 270 143 L 282 132 L 284 126 L 44 126 L 44 138 Z" fill="url(#car-crimson)" opacity="0.9" />

    <!-- Front & Rear Bumpers -->
    <rect x="38" y="132" width="8" height="12" rx="3" fill="#4A4A4F" />
    <rect x="282" y="128" width="8" height="14" rx="3" fill="#4A4A4F" />

    <!-- Windows (Cab with 4 seats profile) -->
    <!-- Rear passenger window -->
    <path d="M 98 106 L 134 72 C 140 66, 146 64, 155 64 L 168 64 L 168 106 Z" fill="url(#car-glass)" stroke="#4A4A4F" stroke-width="2" />
    <!-- Rear headrest / seat silhouette -->
    <circle cx="145" cy="85" r="7" fill="#8D5B4C" />
    <path d="M 136 104 C 136 94, 145 92, 154 94 L 154 106 Z" fill="#6B3724" />

    <!-- Front passenger / driver window -->
    <path d="M 174 64 L 208 64 C 218 64, 226 68, 232 78 L 246 106 L 174 106 Z" fill="url(#car-glass)" stroke="#4A4A4F" stroke-width="2" />
    <!-- Front headrest / seat silhouette -->
    <circle cx="205" cy="85" r="7" fill="#8D5B4C" />
    <path d="M 196 104 C 196 94, 205 92, 214 94 L 214 106 Z" fill="#6B3724" />
    <!-- Steering wheel silhouette -->
    <ellipse cx="225" cy="94" rx="3" ry="8" fill="#25211F" />

    <!-- B-pillar and door lines -->
    <line x1="171" y1="64" x2="171" y2="136" stroke="#DE8C12" stroke-width="2.5" />
    <line x1="94" y1="110" x2="94" y2="136" stroke="#DE8C12" stroke-width="1.5" />

    <!-- Door Handles -->
    <rect x="142" y="112" width="14" height="4" rx="1.5" fill="#25211F" stroke="#EAC8B7" stroke-width="0.5" />
    <rect x="185" y="112" width="14" height="4" rx="1.5" fill="#25211F" stroke="#EAC8B7" stroke-width="0.5" />

    <!-- Side Mirror -->
    <path d="M 235 98 L 244 98 C 248 98, 250 102, 248 106 L 235 106 Z" fill="#9F190E" stroke="#25211F" stroke-width="1" />

    <!-- Headlight Assembly -->
    <path d="M 270 110 C 278 110, 286 114, 286 122 C 286 126, 276 126, 268 124 Z" fill="#FFFBEB" stroke="#68615D" stroke-width="1.5" />
    <ellipse cx="278" cy="117" rx="4" ry="5" fill="#FDB432" />

    <!-- Headlight Beam -->
    <polygon points="286,118 318,102 318,136" fill="url(#car-beam)" />
    <line x1="288" y1="112" x2="312" y2="106" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <line x1="290" y1="118" x2="318" y2="118" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
    <line x1="288" y1="124" x2="312" y2="130" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Tail light -->
    <path d="M 44 116 C 42 120, 42 124, 44 126 L 50 126 L 50 116 Z" fill="#BA2114" stroke="#801209" stroke-width="1" />
    <rect x="44" y="118" width="4" height="4" fill="#FDB432" />

    <!-- Taxi / Rapira Squad Roof Sign -->
    <rect x="180" y="49" width="30" height="9" rx="3" fill="#BA2114" stroke="#FDB432" stroke-width="1.5" />
    <text x="195" y="55.5" font-size="4.5" font-weight="bold" fill="#FCF0E4" font-family="sans-serif" text-anchor="middle">SQUAD</text>
  </g>

  <!-- 4 friends road trip / musical vibes -->
  <g opacity="0.8">
    <path d="M 130 38 Q 138 30 146 36" fill="none" stroke="#9F190E" stroke-width="2" stroke-linecap="round" />
    <circle cx="130" cy="38" r="2.5" fill="#9F190E" />
    <path d="M 240 35 Q 248 27 256 33" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" />
    <circle cx="240" cy="35" r="2.5" fill="#F5A623" />
  </g>
</svg>
