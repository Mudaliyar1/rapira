<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e9aaf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c757d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="75" cy="75" r="75" fill="url(#bgGradient)"/>

  <!-- Person icon - more Instagram-like -->
  <g fill="#ffffff" transform="translate(75, 75)">
    <!-- Head -->
    <circle cx="0" cy="-18" r="18"/>

    <!-- Body/Shoulders -->
    <path d="M -30 22 Q -30 8 -22 8 L 22 8 Q 30 8 30 22 L 30 50 L -30 50 Z"/>
  </g>
</svg>
